<!doctype html>
<!-- Muestra un archivo Markdown del repositorio con el estilo del curso: ver.html?f=entregas/aa1.md
     Lo genera _plantillas; se copia a la raíz de cada repositorio. El data-curso lo pone el script de sincronización. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documento del curso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400;600&family=Overpass:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="assets/presentacion.css">
  <script src="assets/tema.js"></script>
</head>
<body class="portal" data-curso="poo-go">
<main class="portal-contenido documento">
  <div class="barra-documento">
    <a class="volver" href="index.html">Volver al curso</a>
    <span class="acciones">
      <button type="button" id="copiar" class="principal" hidden>Copiar este documento</button>
      <a id="original" href="#">Ver el archivo original</a>
      <button type="button" data-alternar-tema>Modo oscuro</button>
    </span>
  </div>
  <span class="aviso-copia" id="aviso" aria-live="polite"></span>
  <article id="contenido"><p>Cargando…</p></article>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(async function () {
  const f = new URLSearchParams(location.search).get('f') || '';
  const contenido = document.getElementById('contenido');
  // Solo archivos .md dentro del propio repositorio
  if (!/^[a-z0-9][a-z0-9\-\/]*\.md$/i.test(f) || f.includes('..')) {
    contenido.innerHTML = '<p>No se indicó un documento válido. Vuelve al inicio del curso.</p>';
    return;
  }
  document.getElementById('original').href = f;
  // Abierto con doble clic (file://): el navegador no deja leer el .md
  if (location.protocol === 'file:') {
    contenido.innerHTML = '<p>Este visor necesita abrirse desde la página publicada del curso, no desde un archivo descargado. ' +
      'Mientras tanto, puedes abrir el <a href="' + f + '">archivo original</a>.</p>';
    return;
  }
  let r;
  try {
    r = await fetch(f, { cache: 'no-store' });
  } catch (e) {
    contenido.innerHTML = '<p>No se pudo cargar el documento. Revisa tu conexión y recarga la página, o abre el <a href="' + f + '">archivo original</a>.</p>';
    return;
  }
  if (r.status === 404) {
    contenido.innerHTML = '<p>Este documento todavía no está publicado.</p>';
    return;
  }
  try {
    if (!r.ok) throw new Error(r.status);
    const texto = await r.text();
    contenido.innerHTML = marked.parse(texto);
    contenido.querySelectorAll('table').forEach((t) => {
      const caja = document.createElement('div');
      caja.className = 'tabla-scroll';
      t.replaceWith(caja);
      caja.appendChild(t);
    });
    const h1 = contenido.querySelector('h1');
    if (h1) document.title = h1.textContent;
    if (/tutor\.md$/.test(f)) {
      const b = document.getElementById('copiar');
      b.textContent = 'Copiar tutor';
      b.hidden = false;
      b.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(texto);
          document.getElementById('aviso').textContent = 'Tutor copiado. Pégalo completo en ChatGPT, Gemini o Claude.';
        } catch (e) {
          document.getElementById('aviso').textContent = 'No se pudo copiar. Abre "Ver el archivo original", selecciona todo y cópialo.';
        }
      });
    }
  } catch (e) {
    contenido.innerHTML = '<p>No se pudo mostrar el documento. Recarga la página o abre el <a href="' + f + '">archivo original</a>.</p>';
  }
})();
</script>
</body>
</html>
